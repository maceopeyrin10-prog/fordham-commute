name: Fordham commute

# What this does, in plain English:
#
#   Every 10 minutes during the day it wakes up and asks "anything to do?",
#   which is almost always no, and stops.
#
#   On a day you have class it will:
#     * create today's two events the first time it runs, then
#     * keep refreshing the train event once you are inside 35 minutes of
#       the train, so the track number lands on it the moment the MTA posts
#       it (measured: 19-20 minutes before departure).
#
#   Running often is deliberate. GitHub's free scheduler is not punctual --
#   it can fire 5-30 minutes late -- so one precisely-timed run would often
#   miss the window entirely. Many cheap attempts beat one exact one.

on:
  schedule:
    # Every 10 minutes, 10:00-22:59 UTC, Monday to Friday.
    # Roughly 6am-7pm New York time in summer, 5am-6pm in winter.
    # GitHub only understands UTC, so the script checks the real local time
    # itself and does nothing if today is not actually a class day.
    #
    # About 1,700 billed minutes a month, inside the free 2,000 for a
    # private repo. If you make the repo public, minutes are unlimited and
    # you can change */10 to */5 for a better chance at the track.
    - cron: "*/10 10-22 * * 1-5"

  # Lets you press a button in the Actions tab to run it right now.
  workflow_dispatch:

# Never let two runs fight over the same calendar event.
concurrency:
  group: commute
  cancel-in-progress: false

jobs:
  commute:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pieces it needs
        run: pip install --quiet -r requirements.txt

      - name: Hand the robot account its key
        env:
          ROBOT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$ROBOT_KEY" ]; then
            echo "The GOOGLE_SERVICE_ACCOUNT repository secret is not set,"
            echo "or it is not spelled exactly that way."
            echo "See the README, section 'Making it run on its own'."
            exit 1
          fi

          # Write it out, stripping a leading byte-order mark if Notepad added
          # one, since that alone is enough to make it unreadable as JSON.
          printf '%s' "$ROBOT_KEY" | sed '1s/^\xEF\xBB\xBF//' > service_account.json

          # Report the shape of it, never the contents.
          echo "secret length : ${#ROBOT_KEY} characters"
          echo "file written  : $(wc -c < service_account.json) bytes"
          echo "starts with   : $(head -c 1 service_account.json)"

          python -c "import json,sys; d=json.load(open('service_account.json')); \
            print('valid JSON, key belongs to:', d.get('client_email')); \
            sys.exit(0 if d.get('private_key') else 1)" \
          || {
            echo ""
            echo "That secret is not a usable service account key."
            echo "A good one is about 2,300 characters, starts with {, and ends with }."
            echo "Open service_account.json in Notepad, press Ctrl+A then Ctrl+C,"
            echo "and paste the whole thing over the existing secret value."
            exit 1
          }

      - name: Work out today's train
        run: python commute.py auto

      - name: Shred the key again
        if: always()
        run: rm -f service_account.json
