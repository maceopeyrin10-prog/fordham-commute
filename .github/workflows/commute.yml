name: Refresh timetable

# This no longer runs your morning. Apps Script does that, every 5 minutes,
# on Google's servers -- see commute.gs and the README.
#
# The reason is measured, not theoretical: GitHub runs this workflow reliably
# when asked directly, but its own scheduler throttled a "every 5 minutes"
# cron down to two runs in three days. On 31 August the single run of the day
# arrived an hour before the track window opened, and the track was missed.
#
# A once-a-day scheduler is useless for catching a track number that appears
# 19 minutes before departure. It is perfectly adequate for refreshing a
# timetable that changes a few times a year. So that is all this does now.

on:
  schedule:
    # Once a day, well off the hour. If GitHub drops a few, nothing breaks --
    # the committed timetable stays valid for weeks.
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  timetable:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pieces it needs
        run: pip install --quiet -r requirements.txt

      - name: Rebuild the daily timetable files
        run: python build_timetable.py

      - name: Commit them if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable
          if git diff --cached --quiet; then
            echo "Timetable unchanged - nothing to commit."
          else
            git commit -m "Refresh Metro-North timetable"
            git push
            echo "Timetable updated."
          fi
